# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard → New → Blueprint → pick this repo.
# Render reads this file and creates the service; you then set the secret
# values marked `sync: false` in the dashboard before the first deploy finishes.
#
# NOTE ON THE PLAN: `starter` is deliberate, not an upsell. The free plan has no
# persistent disk, so the SQLite file — catalogue, carts, orders, chat history —
# is destroyed on every deploy and restart. Free instances also sleep after 15
# minutes idle and take ~50s to wake, which a customer experiences as a message
# that goes unanswered. If you drop to `free`, delete the `disk:` block below and
# treat all data as disposable.

services:
  - type: web
    name: next-minute-delivery-agent
    runtime: node
    plan: starter
    region: oregon # move closer to your customers if Render offers a nearer region
    branch: main

    # devDependencies are TypeScript types only; nothing is needed at runtime,
    # because Node 24 strips the types itself and there is no build step.
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.ts

    # Render restarts the service if this stops returning 200.
    healthCheckPath: /health

    disk:
      name: store-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # --- runtime -------------------------------------------------------
      - key: NODE_VERSION
        value: "24.16.0"
      - key: DATABASE_PATH
        value: /var/data/store.db
      # On the persistent disk, or photos are lost on every deploy.
      - key: PRODUCT_IMAGES_DIR
        value: /var/data/product-images
      # Backups of the trading record. On the persistent disk, next to the
      # database — which protects against a bad write or a mistaken delete, but
      # NOT against losing the disk. For that, download a copy: the routes at
      # /backup hand out the orders as a spreadsheet and the whole database as a
      # file, and BACKUP_TOKEN below is what guards them.
      - key: BACKUP_DIR
        value: /var/data/backups
      # Daily, keeping a fortnight. 0 hours switches automatic snapshots off;
      # 0 kept switches the pruning off and keeps every snapshot forever.
      - key: BACKUP_EVERY_HOURS
        value: "24"
      - key: BACKUP_KEEP
        value: "14"
      # The simulator has no authentication and can place real orders.
      - key: ENABLE_SIMULATOR
        value: "false"
      # Imported only when the catalogue is empty, so it never clobbers live data.
      # Point this at your own CSV once you have one.
      - key: SEED_CATALOG_PATH
        value: ./data/sample-products.csv
      # The committed CSV is the source of truth: Render has no shell to run
      # the importer from, so without this a live catalogue can never be fixed.
      - key: CATALOG_SYNC_ON_BOOT
        value: "true"
      - key: RESTRICTED_SKUS
        value: "BEV-001"
      # Restaurants and their menus, on the same principle as the catalogue
      # above. Outlets import first; a menu row names its outlet and is skipped
      # if that outlet is not there yet.
      #
      # These point at the real partner files. ./data/sample-outlets.csv and
      # ./data/sample-menu.csv hold six invented restaurants instead, for
      # testing against something that is not somebody's real business.
      - key: SEED_OUTLETS_PATH
        value: ./data/outlets.csv
      - key: SEED_MENU_PATH
        value: ./data/menu.csv
      # Who the delivery associates are: name, number, vehicle. DRIVER_NUMBERS
      # still decides who is offered a job; this says who they are once one is
      # taken, so an order records a person and a van rather than a number
      # somebody has to look up.
      - key: SEED_ASSOCIATES_PATH
        value: ./data/sample-associates.csv

      # --- secrets: set these in the Render dashboard, never in this file ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # The password on the backup downloads, which return every customer's name,
      # address and pin. At least 24 characters, or the routes refuse to mount —
      # generate one with `openssl rand -hex 24`. Unset means no download routes
      # at all, which is the safe default but leaves you with no copy off the
      # disk. Treat the resulting link as the password itself: it appears in the
      # host's request log, so rotate this if it goes anywhere it should not.
      # Your delivery associates, as CSV lines:
      #   phone,name,vehicle,active
      #   5926001111,Rider One,GSS 1234,1
      # Set here and not in the repository: a menu can be committed, a list of
      # your employees' names and mobile numbers cannot.
      - key: ASSOCIATES
        sync: false

      - key: BACKUP_TOKEN
        sync: false
      # Voice-note transcription. Claude cannot hear audio, so this is the
      # one external service besides Anthropic. Unset = voice notes decline.
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false

      # --- store settings: safe to keep in version control ---------------
      # Staff reach the dispatch queue instead of the shopping agent, and get
      # every new order. Empty means orders are placed and nobody is told.
      - key: STAFF_NUMBERS
        value: ""
      # Riders. Told when food is cooked, with the pickup pin, the customer's
      # pin and the cash to collect. Empty means food is cooked and no one is
      # sent to fetch it — which a customer experiences as the shop not coming.
      - key: DRIVER_NUMBERS
        value: ""
      # Minutes an order may sit in a stage before staff are told it has
      # stopped moving. 0 on STALL_ALERT_MINUTES switches the watch off.
      # Only offer a collection to associates within this many miles of the
      # pickup. 0 = off. Nobody whose position is unknown is ever excluded.
      - key: ASSOCIATE_RADIUS_MILES
        value: "0"
      # Cap on deliveries one associate may hold. 0 = no cap, which is right
      # while several orders from one kitchen are collected in a single trip.
      - key: MAX_JOBS_PER_ASSOCIATE
        value: "0"
      # How long a clock-in lasts before it lapses on its own. Somebody will
      # forget to clock off, and the shop trades around the clock - a forgotten
      # shift means job cards at three in the morning.
      - key: ASSOCIATE_DUTY_HOURS
        value: "12"
      # The most an associate may work in any rolling 24 hours, counted across
      # every stretch - so stopping and starting cannot reset it. Rolling
      # rather than per calendar day, or somebody works 11pm to 11pm and never
      # breaks it. 0 switches the cap off.
      - key: ASSOCIATE_MAX_HOURS_PER_DAY
        value: "12"
      # Four digits the customer reads out at the door, so the shop can show
      # the right bag reached the right person - and so an associate accused of
      # keeping an order has something better than their word. It never blocks
      # a delivery: no code means the drop is recorded unverified and dispatch
      # is told. "false" switches it off.
      - key: DELIVERY_CODE
        value: "true"
      # A copy of the trading record, pushed off the machine over WhatsApp.
      # The snapshots live on the same disk as the database they protect, which
      # survives a bad migration but not losing the disk. 0 switches it off;
      # BACKUP_TO defaults to the first STAFF_NUMBERS entry.
      - key: BACKUP_SEND_HOURS
        value: "24"
      - key: STALL_ALERT_MINUTES
        value: "15"
      - key: STALL_PENDING_MINUTES
        value: "10"
      - key: STALL_DELIVERY_MINUTES
        value: "60"
      - key: TEMPLATE_ORDER_ON_THE_WAY
        value: ""
      - key: TEMPLATE_ORDER_DELIVERED
        value: ""
      # Reaches a kitchen whose 24-hour window has shut, which is most first
      # orders of the day. One body variable, the order number, and a
      # quick-reply button: the tap reopens the window and the real ticket
      # follows. Unset means staff are told to ring them instead.
      - key: TEMPLATE_KITCHEN_NEW_ORDER
        value: ""
      - key: TEMPLATE_LANGUAGE
        value: "en"
      - key: STORE_TIMEZONE
        value: "America/Guyana"
      - key: AGENT_EFFORT
        value: "low"
      - key: WHATSAPP_GRAPH_VERSION
        value: v23.0
      - key: STORE_NAME
        value: "Next Minute Delivery"
      # Quoted to customers verbatim AND parsed per day. "24 hours", "24/7",
      # "always open" and "round the clock" all mean the shop never closes:
      # orders are taken at any hour and nothing is ever said about deliveries
      # having finished for the day. A restaurant still keeps its own hours —
      # a kitchen that is shut cannot cook, whatever the shop is doing.
      - key: STORE_HOURS
        value: "24 hours"
      - key: DELIVERY_AREAS
        value: "Georgetown, East Bank Demerara, East Coast Demerara"
      # The delivery area as a circle, checked against every location pin.
      # A radius of 0, or a blank centre, switches the check off.
      - key: SERVICE_CENTRE_LAT
        value: ""
      - key: SERVICE_CENTRE_LNG
        value: ""
      - key: SERVICE_RADIUS_KM
        value: "0"
      - key: PAYMENT_METHODS
        value: "cash"
      - key: DELIVERY_FEE
        value: "500"
      - key: FREE_DELIVERY_OVER
        value: "10000"
      - key: MIN_ORDER_TOTAL
        value: "1000"
      - key: CURRENCY_CODE
        value: "GYD"
      - key: CURRENCY_SYMBOL
        value: "$"
      - key: CURRENCY_DECIMALS
        value: "0"
