<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grocery Agent Simulator</title>
<style>
  :root {
    --bg: #0e1418;
    --panel: #131c21;
    --chat-bg: #0b141a;
    --bubble-in: #1f2c34;
    --bubble-out: #005c4b;
    --text: #e9edef;
    --muted: #8696a0;
    --accent: #00a884;
    --border: #22303a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .chat { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header .avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--accent);
    display: grid; place-items: center; font-size: 18px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  header input {
    background: var(--chat-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 150px;
  }
  header button {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--muted); }

  #log { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; }
  .row.out { justify-content: flex-end; }
  .bubble {
    max-width: min(560px, 78%); padding: 8px 11px; border-radius: 8px;
    white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 1px rgba(0,0,0,.3);
  }
  .in .bubble { background: var(--bubble-in); border-top-left-radius: 2px; }
  .out .bubble { background: var(--bubble-out); border-top-right-radius: 2px; }
  .bubble b { font-weight: 600; }
  .btns { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .btns button {
    background: transparent; border: none; border-top: 1px solid rgba(255,255,255,.12);
    color: #53bdeb; padding: 9px; font-size: 14px; cursor: pointer; width: 100%;
  }
  .btns button:hover { background: rgba(255,255,255,.05); }
  .meta { text-align: center; color: var(--muted); font-size: 12px; padding: 6px; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }

  form { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--border); }
  form input {
    flex: 1; background: var(--chat-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 20px; padding: 10px 16px; font-size: 15px; outline: none;
  }
  form input:focus { border-color: var(--accent); }
  form button {
    background: var(--accent); border: none; color: #04231c; font-weight: 600;
    border-radius: 20px; padding: 10px 20px; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
  #attach {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 20px; padding: 10px 14px; font-size: 16px; cursor: pointer;
  }
  #attach:hover { color: var(--text); border-color: var(--muted); }
  #attach.armed { color: var(--accent); border-color: var(--accent); }
  .bubble img { max-width: 240px; border-radius: 6px; display: block; margin-bottom: 6px; }

  aside {
    width: 300px; flex: 0 0 300px; background: var(--panel); border-left: 1px solid var(--border);
    padding: 16px; overflow-y: auto; font-size: 13px;
  }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  aside .card { background: var(--chat-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  aside .line { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  aside .line span:last-child { color: var(--muted); white-space: nowrap; }
  aside .total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; font-weight: 600; }
  aside .empty { color: var(--muted); }
  @media (max-width: 860px) { aside { display: none; } }
</style>
</head>
<body>
  <div class="chat">
    <header>
      <div class="avatar">🛒</div>
      <div>
        <h1 id="storeName">Grocery Agent</h1>
        <div class="sub">simulator — same code path as WhatsApp</div>
      </div>
      <div class="spacer"></div>
      <input id="phone" value="5920000000" title="Customer phone number (the identity key)" />
      <button id="reset" type="button">Reset</button>
    </header>

    <div id="log">
      <div class="meta">Send a message to start. Try “what do you have?” or “I need rice and chicken”.</div>
    </div>

    <form id="composer">
      <input type="file" id="file" accept="image/*" hidden />
      <button id="attach" type="button" title="Attach a photo of a shopping list">📎</button>
      <input id="text" placeholder="Type a message" autocomplete="off" autofocus />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <aside>
    <h2>Customer</h2>
    <div class="card" id="customer"><div class="empty">No details saved</div></div>
    <h2>Cart</h2>
    <div class="card" id="cart"><div class="empty">Empty</div></div>
    <h2>Recent orders</h2>
    <div class="card" id="orders"><div class="empty">None</div></div>
    <h2>Catalog</h2>
    <div class="card" id="catalog"><div class="empty">—</div></div>
  </aside>

<script>
const log = document.getElementById('log');
const form = document.getElementById('composer');
const input = document.getElementById('text');
const sendBtn = document.getElementById('send');
const phoneEl = document.getElementById('phone');

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
// WhatsApp's own lightweight markup, so the preview matches the phone.
const waFormat = (s) =>
  esc(s)
    .replace(/\*(?=\S)([^*]+?)(?<=\S)\*/g, '<b>$1</b>')
    .replace(/_(?=\S)([^_]+?)(?<=\S)_/g, '<i>$1</i>');

function bubble(dir, html) {
  const row = document.createElement('div');
  row.className = 'row ' + dir;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = html;
  row.appendChild(b);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function renderOutbound(msg) {
  const photo = msg.kind === 'image'
    ? '<img src="' + esc(msg.imageUrl) + '" alt="product photo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'meta',textContent:'[photo failed to load: '+this.src+']'}))">'
    : '';
  const b = bubble('in', photo + waFormat(msg.text));
  if (msg.kind === 'buttons') {
    const wrap = document.createElement('div');
    wrap.className = 'btns';
    for (const btn of msg.buttons) {
      const el = document.createElement('button');
      el.type = 'button';
      el.textContent = btn.title;
      el.onclick = () => { wrap.querySelectorAll('button').forEach(x => x.disabled = true); send(btn.title); };
      wrap.appendChild(el);
    }
    b.appendChild(wrap);
  }
  log.scrollTop = log.scrollHeight;
}

function renderState(state) {
  if (!state) return;
  document.getElementById('storeName').textContent = state.storeName;
  document.title = state.storeName + ' — Simulator';

  const c = state.customer;
  document.getElementById('customer').innerHTML =
    (c.name || c.address)
      ? `<div class="line"><span>Name</span><span>${esc(c.name || '—')}</span></div>
         <div class="line"><span>Address</span><span>${esc(c.address || '—')}</span></div>`
      : '<div class="empty">No details saved</div>';

  const cart = state.cart;
  document.getElementById('cart').innerHTML = cart.items.length
    ? cart.items.map(i => `<div class="line"><span>${i.qty} × ${esc(i.name)}</span><span>${esc(i.lineTotal)}</span></div>`).join('')
      + `<div class="line"><span>Delivery</span><span>${esc(cart.deliveryFee)}</span></div>`
      + `<div class="line total"><span>Total</span><span>${esc(cart.total)}</span></div>`
    : '<div class="empty">Empty</div>';

  document.getElementById('orders').innerHTML = state.orders.length
    ? state.orders.map(o => `<div class="line"><span>${esc(o.orderNo)}</span><span>${esc(o.total)} · ${esc(o.status)}</span></div>`).join('')
    : '<div class="empty">None</div>';

  document.getElementById('catalog').innerHTML = state.catalogSize
    ? `<div class="line"><span>Active products</span><span>${state.catalogSize}</span></div>`
    : '<div class="empty">No products imported yet — run <code>npm run import:catalog</code></div>';
}

let busy = false;
async function send(text) {
  if (busy || (!text.trim() && !pending)) return;
  busy = true;
  sendBtn.disabled = true;

  const attached = pending;
  pending = null;
  attachBtn.classList.remove('armed');
  attachBtn.title = 'Attach a photo of a shopping list';
  input.placeholder = 'Type a message';

  const preview = attached
    ? '<img src="data:' + attached.mediaType + ';base64,' + attached.base64 + '" alt="attached photo">'
    : '';
  bubble('out', preview + waFormat(text));

  const typing = document.createElement('div');
  typing.className = 'meta typing';
  typing.textContent = 'typing…';
  log.appendChild(typing);
  log.scrollTop = log.scrollHeight;

  try {
    const res = await fetch('./api/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: phoneEl.value,
        text,
        ...(attached ? { image: { base64: attached.base64, mediaType: attached.mediaType } } : {}),
      }),
    });
    const data = await res.json();
    typing.remove();
    if (data.error) bubble('in', '<i>Error: ' + esc(data.error) + '</i>');
    else {
      for (const msg of data.outbound) renderOutbound(msg);
      renderState(data.state);
    }
  } catch (err) {
    typing.remove();
    bubble('in', '<i>Network error: ' + esc(String(err)) + '</i>');
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

// Attaching a photo of a handwritten list — the same path WhatsApp images take.
const fileEl = document.getElementById('file');
const attachBtn = document.getElementById('attach');
let pending = null;

attachBtn.onclick = () => fileEl.click();
fileEl.onchange = () => {
  const f = fileEl.files && fileEl.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    pending = { base64: String(reader.result).split(',')[1], mediaType: f.type, name: f.name };
    attachBtn.classList.add('armed');
    attachBtn.title = 'Attached: ' + f.name;
    input.placeholder = f.name + ' attached — add a note or just send';
    input.focus();
  };
  reader.readAsDataURL(f);
};

form.onsubmit = (e) => { e.preventDefault(); const t = input.value; input.value = ''; send(t); };

document.getElementById('reset').onclick = async () => {
  const res = await fetch('./api/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: phoneEl.value }),
  });
  const data = await res.json();
  log.innerHTML = '<div class="meta">Conversation reset.</div>';
  renderState(data.state);
};

phoneEl.onchange = refresh;
async function refresh() {
  const res = await fetch('./api/state?phone=' + encodeURIComponent(phoneEl.value));
  renderState(await res.json());
}
refresh();
</script>
</body>
</html>
